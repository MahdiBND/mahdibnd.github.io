[project]
name = "mahdi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.6"
dependencies = [
    "httpx2>=2.12.0",
    "openai-agents>=0.22.2",
    "python-dotenv>=1.2.3",
    "setuptools>=84.0.0",
]

[tool.uv.workspace]

[project.scripts]
code-assist = "bots.coder.cli:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["bots*", "src*"]